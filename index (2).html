<!DOCTYPE html>

    <style>
        
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    header { background: #2c3e50; color: white; padding: 20px 0; text-align: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    header h1 { margin-bottom: 10px; font-size: 2.5rem; letter-spacing: 2px; }

    nav a:hover, nav a.active { background: #1abc9c; color: white; }
    .hero { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=1600') no-repeat center center/cover; height: 400px; display: flex; justify-content: center; align-items: center; color: white; text-align: center; }
    .hero-japan { background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=1600'); }
    .hero-france { background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=1600'); }
    .hero-egypt { background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1539650116574-8efeb43e2750?w=1600'); }
    .hero-italy { background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1498503182468-3b51cbb6cb24?w=1600'); }
    .hero h2 { font-size: 3rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); }
    .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    .welcome-section { text-align: center; margin-bottom: 50px; }
    .welcome-section p { font-size: 1.2rem; color: #666; max-width: 800px; margin: 20px auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
    .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s ease; text-decoration: none; color: inherit; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card-content { padding: 20px; }
    .card-content h3 { margin-bottom: 10px; color: #2c3e50; }
    .section-block { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 40px; }
    .section-block h3 { color: #2c3e50; border-left: 5px solid #1abc9c; padding-left: 15px; margin-bottom: 20px; font-size: 1.5rem; }
    .景点-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .景点-item img { width: 100%; height: 220px; object-fit: cover; border-radius: 6px; }
    .景点-item h4 { margin: 10px 0 5px; color: #34495e; }
    footer { background: #2c3e50; color: white; text-align: center; padding: 20px 0; margin-top: 60px; font-size: 0.9rem; }
